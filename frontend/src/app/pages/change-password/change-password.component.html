<div class="page-wrap">
  <a routerLink="/profile" class="back-link">
    <app-icon name="arrow-left" [size]="14"></app-icon> Back to profile
  </a>

  <div class="page-heading">
    <h1>Change password</h1>
    <p>Choose a strong password you haven't used elsewhere.</p>
  </div>

  <div class="pw-card card">
    @if (error) { <div class="alert alert-error">{{ error }}</div> }
    @if (success) { <div class="alert alert-success">{{ success }}</div> }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="new-pw">New password</label>
        <input id="new-pw" type="password" class="form-control" formControlName="password" autocomplete="new-password" />
      </div>
      <div class="form-group" style="margin-top:14px">
        <label for="confirm-pw">Confirm password</label>
        <input id="confirm-pw" type="password" class="form-control" formControlName="confirm" autocomplete="new-password" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="form.invalid || saving">
          @if (saving) { <span class="spinner"></span> }
          {{ saving ? 'Updating…' : 'Update password' }}
        </button>
      </div>
    </form>
  </div>
</div>
