<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">resumeForge</div>
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a strong password for your account.</p>

    @if (error) { <div class="alert alert-error">{{ error }}</div> }
    @if (success) { <div class="alert alert-success">{{ success }}</div> }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="rp-password">New password</label>
        <input
          id="rp-password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="rp-confirm">Confirm password</label>
        <input
          id="rp-confirm"
          type="password"
          class="form-control"
          formControlName="confirm"
          placeholder="Repeat your password"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading || !!success" id="rp-submit">
        @if (loading) { <span class="spinner"></span> }
        {{ loading ? 'Updating…' : 'Update password' }}
      </button>
    </form>

    <p class="auth-footer-text">
      <a routerLink="/login">← Back to sign in</a>
    </p>
  </div>
</div>
