<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">resumeForge</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Start building resumes that get noticed.</p>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="reg-name">Full name</label>
        <input
          id="reg-name"
          type="text"
          class="form-control"
          [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
          formControlName="name"
          placeholder="Ada Lovelace"
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label for="reg-email">Email</label>
        <input
          id="reg-email"
          type="email"
          class="form-control"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="reg-password">Password <span class="text-muted" style="font-size:11px;text-transform:none">(min 6 chars)</span></label>
        <input
          id="reg-password"
          type="password"
          class="form-control"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading" id="reg-submit">
        @if (loading) { <span class="spinner"></span> }
        {{ loading ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
