<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">resumeForge</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to your account to continue.</p>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="form-control"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="login-password">
          Password
          <a routerLink="/forgot-password" class="label-link">Forgot?</a>
        </label>
        <input
          id="login-password"
          type="password"
          class="form-control"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading || trialLoading" id="login-submit">
        @if (loading) {
          <span class="spinner"></span>
        }
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="trial-divider"><span>or</span></div>

    <button
      type="button"
      class="btn-secondary btn-full trial-btn"
      (click)="startTrial()"
      [disabled]="loading || trialLoading"
      id="trial-free-btn"
    >
      @if (trialLoading) {
        <span class="spinner"></span> Opening trial…
      } @else {
        Try free trial — Trial Free
      }
    </button>
    <p class="trial-hint">No signup needed. Demo account with sample resumes & applications.</p>

    <p class="auth-footer-text">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
